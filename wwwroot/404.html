<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Redirection…</title>
    <script>
        // GitHub Pages ignore le routage côté client de Blazor : une URL
        // profonde déclenche un 404. On mémorise le chemin demandé, puis on
        // relance l'application à sa racine ; index.html le restaurera.
        sessionStorage.redirect = location.pathname + location.search + location.hash;

        // Redirige vers /NomDuDepot/ (1er segment du chemin)
        location.replace(
            location.protocol + '//' + location.host +
            location.pathname.split('/').slice(0, 2).join('/') + '/'
        );
    </script>
</head>
<body></body>
</html>
